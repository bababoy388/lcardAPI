; ============================================
; Конфигурация C++ сервиса L-Card
; ============================================

[Device]
; Серийный номер крейта. 
; Оставьте пустым, если у вас один крейт (подключится к первому найденному).
; Если крейтов несколько, укажите точный номер, например: 1T217041
csn          = 
; Номер слота, в котором установлен модуль LTR24 (обычно 1)
slot         = 1

[ADC]
freq_hz      = 29297
; Формат данных: 24 или 20 (бит)
format       = 24

[Channel0]
; Включение 1-го канала (true/false)
enable       = true
; Диапазон: 2 (для ±2 В) или 10 (для ±10 В)
range        = 2
; AC-режим (отсечка постоянной составляющей): true/false
ac           = false
; ICP-режим (для LTR24-1 всегда false)
icp          = false

[Channel1]
enable       = true
range        = 2
ac           = false
icp          = false

[Channel2]
enable       = false
range        = 2
ac           = false
icp          = false

[Channel3]
enable       = false
range        = 2
ac           = false
icp          = false

[Output]
; Размер блока приёма (в словах). 
; 512 слов при 2-х включенных каналах = 256 временных точек за один такт чтения.
block_size   = 512